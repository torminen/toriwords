name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "spec/fixtures/**"
      - "tools/dictionary/release.json"
      - "tools/dictionary/dictionary.sqlite.sha256"
      - "tools/dictionary/fetch.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "spec/fixtures/**"
      - "tools/dictionary/release.json"
      - "tools/dictionary/dictionary.sqlite.sha256"
      - "tools/dictionary/fetch.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Assumption: Xcode 26.4 (iOS 26.4 SDK, Swift 6.3) on the GitHub `macos-26` image. The app's deployment target is
  # iOS 26.0 and ToriKit's swift-tools-version is 6.2, so any Xcode 26.x or later works; bump both lines together.
  XCODE_VERSION: "26.4"

jobs:
  toriKit-package:
    name: ToriKit-Package (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Pick an iPhone simulator
        id: sim
        run: |
          ID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/spm-toriKit
          key: spm-toriKit-${{ env.XCODE_VERSION }}-${{ hashFiles('ios/ToriKit/Package.resolved') }}
      - name: xcodebuild test (all ToriKit test targets, incl. ToriUITests)
        working-directory: ios/ToriKit
        env:
          # Passed to the test process (TEST_RUNNER_ prefix is stripped).
          TEST_RUNNER_TORI_FIXTURES: ${{ github.workspace }}/spec/fixtures
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme ToriKit-Package \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -clonedSourcePackagesDirPath ~/spm-toriKit \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  app-build:
    name: App build (Debug, simulator)
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: jdx/mise-action@v2
        with:
          install: false
          cache: true
      - name: Install Tuist (version from ios/.tuist-version)
        run: |
          mise use --global "tuist@$(cat .tuist-version)"
          tuist version
      - uses: actions/cache@v4
        with:
          path: ios/Tuist/.build
          key: tuist-deps-${{ env.XCODE_VERSION }}-${{ hashFiles('ios/Tuist/Package.swift', 'ios/Tuist/Package.resolved', 'ios/ToriKit/Package.resolved') }}
      - name: Dictionary (full Release asset if published, else the committed sample)
        run: |
          URL=$(sed -n 's/.*"asset_url": *"\([^"]*\)".*/\1/p' ../tools/dictionary/release.json)
          if [ -n "$URL" ] && curl -fsIL --retry 2 -o /dev/null "$URL"; then
            # A broken asset must not fail the Debug build: Debug falls back to the sample.
            ../tools/dictionary/fetch.sh || echo "::warning::fetch.sh failed; Debug build uses dictionary-sample.sqlite"
          else
            echo "No published dictionary asset at '$URL'; using Resources/dictionary-sample.sqlite"
          fi
      - name: tuist install + generate
        run: |
          tuist install
          tuist generate --no-open
      - name: xcodebuild build (Debug, iOS Simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Toriwords.xcworkspace \
            -scheme Toriwords \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
