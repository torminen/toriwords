name: ToriKit (Linux)

on:
  push:
    branches: [main]
    paths:
      - "ios/ToriKit/**"
      - "spec/fixtures/**"
      - ".swift-version"
      - ".github/workflows/toriKit-linux.yml"
  pull_request:
    paths:
      - "ios/ToriKit/**"
      - "spec/fixtures/**"
      - ".swift-version"
      - ".github/workflows/toriKit-linux.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: swift test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned by the repo-root .swift-version (swiftly reads it).
      - name: Install swiftly and the pinned Swift toolchain
        run: |
          curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar -xzf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use --assume-yes --post-install-file "$RUNNER_TEMP/swift-post-install.sh"
          if [ -s "$RUNNER_TEMP/swift-post-install.sh" ]; then sudo bash "$RUNNER_TEMP/swift-post-install.sh"; fi
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$HOME/.local/share/swiftly" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$HOME/.local/share/swiftly/bin" >> "$GITHUB_ENV"
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: ios/ToriKit/.build
          key: toriKit-linux-${{ hashFiles('.swift-version', 'ios/ToriKit/Package.resolved') }}-${{ hashFiles('ios/ToriKit/Package.swift') }}
          restore-keys: |
            toriKit-linux-${{ hashFiles('.swift-version', 'ios/ToriKit/Package.resolved') }}-

      - name: swift test
        working-directory: ios/ToriKit
        env:
          TORI_FIXTURES: ${{ github.workspace }}/spec/fixtures
        run: swift test
