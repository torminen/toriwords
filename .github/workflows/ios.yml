name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "spec/fixtures/**"
      - "tools/dictionary/release.json"
      - "tools/dictionary/dictionary.sqlite.sha256"
      - "tools/dictionary/fetch.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "spec/fixtures/**"
      - "tools/dictionary/release.json"
      - "tools/dictionary/dictionary.sqlite.sha256"
      - "tools/dictionary/fetch.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Project decision: iOS 18 deployment target, built with the iOS 27 SDK (Xcode 27, Swift 6.4 like `.swift-version`).
  # The `macos-26` image has no Xcode 27, so jobs run on the `xcode-27` runner label (arm64, public preview);
  # setup-xcode picks the newest installed 27.x. Bump with `.swift-version`.
  XCODE_VERSION: "27"

# Pull requests build and test. A push to main (the merge of a PR that already passed) runs no tests: only the app
# build, to refresh the Xcode compilation cache (CAS) that pull requests restore. Caches saved on a PR are visible to
# that PR only, so main is the one place a cache every PR can read gets saved. Main builds cold and saves a fresh CAS,
# so it never grows across runs; pull requests restore the newest one and save nothing.
jobs:
  # ToriKit tests run natively on macOS: booting an iOS Simulator on the runner took about 7 of the job's 9-10 minutes,
  # the tests themselves about one. No build cache: a cold `swift test` is quick, and .build is close to 1 GB. The
  # iOS-only branches (`#if canImport(UIKit)` in ToriUI and SpeechPlayer) still compile in the app build below; run
  # `xcodebuild test -scheme ToriKit-Package` on a simulator locally (README) to execute them.
  toriKit-package:
    name: ToriKit (macOS)
    if: github.event_name != 'push'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: swift test
        working-directory: ios/ToriKit
        env:
          TORI_FIXTURES: ${{ github.workspace }}/spec/fixtures
        run: swift test

  app-build:
    name: App build (Debug, simulator)
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: jdx/mise-action@v2
        with:
          install: false
          cache: true
      - name: Install Tuist (version from ios/.tuist-version)
        run: |
          mise use --global "tuist@$(cat .tuist-version)"
          tuist version
      - uses: actions/cache@v4
        with:
          path: ios/Tuist/.build
          key: tuist-deps-${{ env.XCODE_VERSION }}-${{ hashFiles('ios/Tuist/Package.swift', 'ios/Tuist/Package.resolved', 'ios/ToriKit/Package.resolved') }}
      - name: Dictionary (full Release asset if published, else the committed sample)
        run: |
          URL=$(sed -n 's/.*"asset_url": *"\([^"]*\)".*/\1/p' ../tools/dictionary/release.json)
          if [ -n "$URL" ] && curl -fsIL --retry 2 -o /dev/null "$URL"; then
            # A broken asset must not fail the Debug build: Debug falls back to the sample.
            ../tools/dictionary/fetch.sh || echo "::warning::fetch.sh failed; Debug build uses dictionary-sample.sqlite"
          else
            echo "No published dictionary asset at '$URL'; using Resources/dictionary-sample.sqlite"
          fi
      - name: tuist install + generate
        run: |
          tuist install
          tuist generate --no-open
      - name: Restore compilation cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: ~/compilation-cache
          key: cc-app-${{ env.XCODE_VERSION }}-${{ github.sha }}
          restore-keys: cc-app-${{ env.XCODE_VERSION }}-
      - name: xcodebuild build (Debug, iOS Simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Toriwords.xcworkspace \
            -scheme Toriwords \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -skipMacroValidation \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$HOME/compilation-cache" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | xcbeautify --renderer github-actions
      - name: Save compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ~/compilation-cache
          key: cc-app-${{ env.XCODE_VERSION }}-${{ github.sha }}
