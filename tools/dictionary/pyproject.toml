[project]
name = "toridict"
version = "0.1.0"
description = "Toriwords dictionary build: kaikki.org en/ru Wiktionary JSONL + wordfreq -> deterministic dictionary.sqlite"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wordfreq==3.1.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
